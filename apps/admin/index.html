<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <script>
      try {
        const persistedTheme = JSON.parse(window.localStorage.getItem('APP_PINIA_THEME') || '{}');
        const storedPreference = persistedTheme.themePreference || persistedTheme.themeName;
        const themePreference = ['system', 'dark', 'light'].includes(storedPreference) ? storedPreference : 'system';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          themePreference === 'dark' || (themePreference === 'system' && prefersDark) ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      }
    </script>
  </head>
  <body>
    <div id="root" class="root-container"></div>
  </body>
</html>
