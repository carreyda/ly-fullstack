name: 功能建议
description: 提议符合项目定位和架构边界的新能力
title: '[Feature] '
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和 Roadmap，没有发现相同建议。
          required: true
        - label: 我理解项目不会为了显得完整而预置未知的终端业务模块。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的真实问题
      description: 请描述实际使用场景，而不是只列出希望新增的技术或依赖。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明能力边界、可能放置的模块和对现有用户的影响。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 说明现有能力、标准库或部署平台为什么不能解决该问题。
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: 验收方式
      description: 描述可以证明功能完成的测试、示例或文档。
    validations:
      required: true
