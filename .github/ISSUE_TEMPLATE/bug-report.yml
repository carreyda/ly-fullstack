name: 缺陷报告
description: 报告可以稳定复现的功能、构建或兼容问题
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 安全漏洞不要公开提交，请使用仓库的 Private Security Advisory。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有发现重复问题。
          required: true
        - label: 我已阅读 README 和相关 docs，并确认这不是已声明的能力边界。
          required: true
        - label: 本报告不包含密码、Token、数据库连接串或其他真实秘密。
          required: true
  - type: input
    id: version
    attributes:
      label: 版本或 Commit
      description: 请填写 Tag、Commit Hash 或分支名称。
      placeholder: v0.1.1 / abc1234
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - Admin
        - Admin API
        - Database / Prisma
        - Setup / Scripts
        - CI / Build
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明预期行为、实际行为和影响。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. 执行 ...
        2. 打开 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Node.js、pnpm、浏览器、PostgreSQL 版本及相关部署方式。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 只粘贴经过脱敏且与问题直接相关的内容。
    validations:
      required: false
