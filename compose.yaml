# 本地开发依赖：PostgreSQL
# Setup 会把本地密码仅注入 Compose 子进程，不会在仓库根目录生成 `.env`。
services:
  postgres:
    image: postgres:17-alpine
    container_name: ly-fullstack-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ly_fullstack}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请通过 pnpm setup 或进程环境变量提供 PostgreSQL 密码}
    volumes:
      # PostgreSQL 数据目录使用 17 官方镜像的标准挂载点，并通过版本化卷名避免误用 18 的数据文件。
      - ly-fullstack-postgres-17-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ly_fullstack}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  # 版本化卷不会读取已有 PostgreSQL 18 数据；历史数据需要通过导出、导入显式迁移。
  ly-fullstack-postgres-17-data:
    name: ly-fullstack-postgres-17-data
